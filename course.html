<!DOCTYPE html>
<html>
<head>
  <title>CYBERDEFEND Course</title>

  <style>
    body {
      background: #050b14;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px;
    }

    .course-box {
      max-width: 800px;
      margin: auto;
      background: #0b1625;
      padding: 30px;
      border-radius: 15px;
      border: 1px solid #168cff;
    }

    h1 {
      color: #168cff;
    }

    .level {
      color: #00d9ff;
      font-size: 18px;
    }

    button {
      background: #168cff;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div class="course-box">

    <h1 id="courseName">Loading...</h1>

    <p class="level" id="courseLevel"></p>

    <h2>What you'll learn</h2>

    <p>
      Learn practical cybersecurity concepts, tools,
      networking, security monitoring and defensive techniques.
    </p>

<button onclick="enroll()">Enroll Now</button>

  </div>

  <script>
    const courseId = new URLSearchParams(
      window.location.search
    ).get("id");

    fetch("/api/courses/" + courseId)
      .then(response => response.json())
      .then(course => {

        document.getElementById("courseName").textContent =
          course.name;

        document.getElementById("courseLevel").textContent =
          "Level: " + course.level;

                   });

  function enroll() {
  const name = prompt("Enter your name:");
  const email = prompt("Enter your email:");

  if (!name || !email) {
    alert("Please enter your name and email.");
    return;
  }

  fetch("/api/enroll", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      name: name,
      email: email,
      course: document.getElementById("courseName").textContent
    })
  })
  .then(response => response.json())
  .then(data => {
    alert(data.message);
  })
  .catch(error => {
    console.error("Enrollment error:", error);
    alert("Something went wrong.");
  });
}    
</script>

</body>
</html>
